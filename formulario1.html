<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style2.css">
    <title>Cadastro</title>
    <style>
        body{
            background-color: rgb(46, 49, 49);
        }
    </style>
</head>

<body>
    <div class="container">


        <div class="componente">

            <form action="cadastro.php" method="post">

                <div class="form-group">
                    <label for="tipo">Tipo pessoa:</label>
                    <select id="tipo" name="tipo" class="form-control">
                        <option value="juridica">Jurídica</option>
                        <option value="fisica">Física</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" class="form-control">
                </div>
                <div class="form-group">
                    <label for="cpf">CPF:</label>
                    <input type="text" id="cpf" name="cpf" class="form-control" maxlength="14" placeholder="999.999.999-99">

                <script>
                document.getElementById('cpf').addEventListener('input', function (e) {
                let cpf = e.target.value.replace(/\D/g, ''); // Remove tudo que não for número

                if (cpf.length > 3) cpf = cpf.substring(0, 3) + '.' + cpf.substring(3);
                if (cpf.length > 7) cpf = cpf.substring(0, 7) + '.' + cpf.substring(7);
                if (cpf.length > 11) cpf = cpf.substring(0, 11) + '-' + cpf.substring(11, 13);

                e.target.value = cpf;
                });
                </script>

                </div>
                <div class="form-group">
                    <label for="telefone">Telefone:</label>
                    <input type="tel" id="telefone" name="telefone" class="form-control">
                </div>
                <div class="form-group">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" class="form-control">
                </div>
                <div class="form-group">
                    <label for="cidade">Cidade:</label>
                    <input type="text" id="cidade" name="cidade" class="form-control">

                    <label for="uf">  UF:</label>
                    <input type="text" id="uf" name="uf" size="7" class="form-control-inline">  
                </div>
                <div class="form-group">
                    <label for="endereco">Endereço:</label>
                    <input type="text" id="endereco" name="endereco" class="form-control">
                     
                    <label for="numero">Número:</label>
                    <input type="text" id="numero" name="numero" size="7"  class="form-control">
                </div>
                <div class="form-group">
                    <label for="data">CNPJ:</label>
                    <input type="text" id="data" name="data" class="form-control">
                     
                    <label for="cep">CEP:</label>
                    <input type="text" id="cep" name="cep" size="7"  class="form-control">
                </div>

            
        </div>
