<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style2.css">
    <title>Cadastro</title>

<script>
    function limparCampos() {
        var campos = document.querySelectorAll('form input[type="text"], form input[type="email"], form input[type="tel"]');

        campos.forEach(function(campo){
            campo.value = "";
        });
    }
</script>

    <style>
        body {
            background-color: rgb(46, 49, 49);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="componente">
            <form action="cadastro.php" method="post">
                <div class="form-group">
                    <label for="tipo">Tipo pessoa:</label>
                    <select id="tipo" name="tipo" class="form-control">
                        <option value="juridica">Jurídica</option>
                        <option value="fisica" selected>Física</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" class="form-control">
                </div>

                <div class="form-group">
                    <label for="documento">CPF/CNPJ:</label>
                    <input type="text" id="documento" name="documento" class="form-control" maxlength="14" placeholder="999.999.999-99">
                </div>

                <div class="form-group">
                    <label for="telefone">Telefone:</label>
                    <input type="tel" id="telefone" name="telefone" class="form-control" maxlength="15" placeholder="(99) 99999-9999">
                </div>

                <div class="form-group">
                    <label for="cep">CEP:</label>
                    <input type="text" id="cep" name="cep" class="form-control" maxlength="9" placeholder="99999-999">
                </div>

                <script>
                    function formatDocumento(value, isCNPJ) {
                        value = value.replace(/\D/g, ''); // Remove tudo que não for número

                        if (isCNPJ) {
                            if (value.length > 2) value = value.substring(0, 2) + '.' + value.substring(2);
                            if (value.length > 6) value = value.substring(0, 6) + '.' + value.substring(6);
                            if (value.length > 10) value = value.substring(0, 10) + '/' + value.substring(10);
                            if (value.length > 15) value = value.substring(0, 15) + '-' + value.substring(15, 17);
                        } else {
                            if (value.length > 3) value = value.substring(0, 3) + '.' + value.substring(3);
                            if (value.length > 7) value = value.substring(0, 7) + '.' + value.substring(7);
                            if (value.length > 11) value = value.substring(0, 11) + '-' + value.substring(11, 13);
                        }

                        return value;
                    }

                    function formatTelefone(value) {
                        value = value.replace(/\D/g, ''); // Remove tudo que não for número

                        if (value.length > 2) value = '(' + value.substring(0, 2) + ') ' + value.substring(2);
                        if (value.length > 9 && value.length <= 10) value = value.substring(0, 9) + '-' + value.substring(9);
                        if (value.length > 10) value = value.substring(0, 10) + '-' + value.substring(10, 15);

                        return value;
                    }

                    function formatCEP(value) {
                        value = value.replace(/\D/g, ''); // Remove tudo que não for número
                        if (value.length > 5) value = value.substring(0, 5) + '-' + value.substring(5, 8);
                        return value;
                    }

                    document.getElementById('tipo').addEventListener('change', function () {
                        let documentoInput = document.getElementById('documento');
                        let tipoPessoa = this.value;
                        
                        documentoInput.value = ''; // Limpa o campo ao mudar o tipo
                        documentoInput.setAttribute("maxlength", tipoPessoa === 'juridica' ? "18" : "14"); 
                        documentoInput.setAttribute("placeholder", tipoPessoa === 'juridica' ? "99.999.999/9999-99" : "999.999.999-99");
                    });

                    document.getElementById('documento').addEventListener('input', function (e) {
                        let tipoPessoa = document.getElementById('tipo').value;
                        e.target.value = formatDocumento(e.target.value, tipoPessoa === 'juridica');
                    });

                    document.getElementById('telefone').addEventListener('input', function (e) {
                        e.target.value = formatTelefone(e.target.value);
                    });

                    document.getElementById('cep').addEventListener('input', function (e) {
                        e.target.value = formatCEP(e.target.value);
                    });
                </script>

                <div class="form-group">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" class="form-control">
                </div>

                <div class="form-group">
                    <label for="cidade">Cidade:</label>
                    <input type="text" id="cidade" name="cidade" class="form-control">

                    <label for="uf"> UF:</label>
                    <input type="text" id="uf" name="uf" size="7" class="form-control-inline">
                </div>

                <div class="form-group">
                    <label for="endereco">Endereço:</label>
                    <input type="text" id="endereco" name="endereco" class="form-control">

                    <label for="numero">Número:</label>
                    <input type="text" id="numero" name="numero" size="7" class="form-control">
                </div>

                <div class="componente3">
                    <div class="form-group">
                        <button type="submit" class="save">Gravar</button>
                
                        <button type="button" class="cancel" onclick="limparCampos()">Limpar</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
